<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL PULSO | Regional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Crimson+Pro:wght@600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; margin: 0; }
        .serif { font-family: 'Crimson Pro', serif; }
        .modal-blur { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .modal-open { display: flex !important; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        #logoTrigger { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="text-slate-900">

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl text-[10px] font-black z-[5000] hidden shadow-2xl uppercase tracking-widest text-center"></div>

    <!-- NAVEGACIÓN -->
    <nav class="bg-white border-b sticky top-0 z-50 h-20 shadow-sm">
        <div class="container mx-auto px-4 h-full flex items-center justify-between">
            <div id="logoTrigger" onclick="handleLogoClick()" class="flex items-center gap-3 cursor-pointer group">
                <div class="bg-red-600 text-white p-2.5 rounded-2xl group-active:scale-95 transition-transform shadow-lg shadow-red-200">
                    <i data-lucide="radio" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tighter uppercase leading-none">EL PULSO</h1>
                    <p class="text-[9px] font-bold text-red-600 uppercase tracking-[0.2em] leading-none mt-1">Regional</p>
                </div>
            </div>
            <select onchange="render(this.value)" class="text-[11px] font-black uppercase bg-slate-100 px-6 py-3 rounded-2xl border-none outline-none appearance-none cursor-pointer">
                <option value="TODAS">TODAS</option>
                <option value="TLAXCALA">TLAXCALA</option>
                <option value="PUEBLA">PUEBLA</option>
            </select>
        </div>
    </nav>

    <!-- CUADRÍCULA DE NOTICIAS -->
    <main class="container mx-auto px-4 py-10 max-w-7xl">
        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <!-- LECTOR -->
    <div id="readerPanel" class="modal-blur">
        <div class="bg-white w-full max-w-3xl rounded-[2.5rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="relative h-80 bg-slate-200">
                <img id="readImg" src="" class="w-full h-full object-cover">
                <button onclick="closeModals()" class="absolute top-6 right-6 bg-black/40 text-white p-4 rounded-full backdrop-blur-md">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="p-10 overflow-y-auto">
                <span id="readRegion" class="text-red-600 font-black text-xs uppercase tracking-widest"></span>
                <h2 id="readTitle" class="serif text-4xl font-black my-6 leading-tight text-slate-900"></h2>
                <div id="readBody" class="text-slate-600 text-xl leading-relaxed space-y-6 whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <!-- PIN DE ACCESO (1593) -->
    <div id="pinPanel" class="modal-blur">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center border border-slate-100">
            <h3 class="font-black text-xs uppercase tracking-widest mb-8 text-slate-400">PIN Requerido</h3>
            <div id="pinDots" class="flex justify-center gap-5 mb-10">
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <script>for(let i=1; i<=9; i++) document.write(`<button onclick="pressPin('${i}')" class="h-16 bg-slate-50 hover:bg-slate-100 rounded-2xl font-bold text-xl">${i}</button>`);</script>
                <button onclick="pin='';resetDots();" class="h-16 bg-red-50 text-red-500 rounded-2xl font-bold">C</button>
                <button onclick="pressPin('0')" class="h-16 bg-slate-50 hover:bg-slate-100 rounded-2xl font-bold text-xl">0</button>
                <button onclick="closeModals()" class="h-16 bg-slate-100 text-slate-400 rounded-2xl font-bold">ESC</button>
            </div>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="adminPanel" class="modal-blur">
        <div class="bg-white w-full max-w-4xl rounded-[3rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="p-8 bg-slate-900 text-white flex justify-between items-center">
                <div class="flex gap-8">
                    <button onclick="setTab('new')" id="tabN" class="text-xs font-black uppercase tracking-widest border-b-4 border-red-500 pb-2">Publicar</button>
                    <button onclick="setTab('list')" id="tabL" class="text-xs font-black uppercase tracking-widest text-slate-400 pb-2">Lista</button>
                </div>
                <button onclick="closeModals()" class="text-slate-400 hover:text-white p-2"><i data-lucide="x" class="w-7 h-7"></i></button>
            </div>

            <div id="tabNewContent" class="p-10 overflow-y-auto space-y-6">
                <!-- SECCIÓN DE CARGA DE IMAGEN (SOLUCIÓN) -->
                <div class="bg-slate-50 p-6 rounded-[2rem] border-2 border-dashed border-slate-200">
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4">1. Selecciona la Imagen</p>
                    <div class="flex gap-4">
                        <label class="flex-1 cursor-pointer">
                            <div class="bg-white border shadow-sm p-4 rounded-2xl text-center hover:bg-slate-50 transition-all">
                                <i data-lucide="image" class="w-5 h-5 mx-auto mb-2 text-red-500"></i>
                                <span class="text-[10px] font-bold uppercase">Subir desde celular</span>
                                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </div>
                        </label>
                        <div class="flex-1">
                            <input type="text" id="fImg" placeholder="O pega URL de imagen..." class="w-full bg-white border p-4 rounded-2xl text-[10px] outline-none shadow-sm h-full">
                        </div>
                    </div>
                    <div id="imgPreview" class="mt-4 hidden"><img src="" id="prevImg" class="h-32 w-full object-cover rounded-xl border shadow-inner"></div>
                </div>

                <!-- SECCIÓN DE TEXTO -->
                <div class="space-y-4">
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">2. Datos de la Nota</p>
                    <div class="grid grid-cols-2 gap-4">
                        <select id="fReg" class="bg-slate-50 p-5 rounded-2xl font-bold text-sm outline-none border border-transparent focus:border-red-500"><option value="TLAXCALA">TLAXCALA</option><option value="PUEBLA">PUEBLA</option></select>
                        <button onclick="runAi('manual')" id="btnAiMan" class="bg-slate-900 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest">Resumir con IA</button>
                    </div>
                    <textarea id="rawText" rows="3" placeholder="Pega el texto aquí para que la IA lo resuma..." class="w-full bg-slate-50 p-5 rounded-[1.5rem] outline-none text-sm border border-transparent focus:border-red-500"></textarea>
                    
                    <form id="newsForm" class="space-y-4 pt-4 border-t">
                        <input type="text" id="fTitle" placeholder="Título Final" class="w-full bg-slate-50 p-5 rounded-2xl font-bold text-lg outline-none shadow-sm" required>
                        <textarea id="fBody" rows="5" placeholder="Contenido de la noticia..." class="w-full bg-slate-50 p-5 rounded-2xl text-base outline-none shadow-sm" required></textarea>
                        <button type="submit" class="w-full bg-red-600 text-white font-black py-6 rounded-[2rem] text-sm uppercase tracking-widest shadow-xl shadow-red-100">Publicar en el Portal</button>
                    </form>
                </div>
            </div>

            <div id="tabListContent" class="p-10 hidden overflow-y-auto"><div id="manageContainer" class="grid gap-4"></div></div>
        </div>
    </div>

    <script>
        // --- COLOCA TU API KEY AQUÍ ---
        const apiKey = "AIzaSyAktd9bPTbnZmRHtJ7O5Uyr2pl64fxPjNI"; 

        let db = JSON.parse(localStorage.getItem('pulso_v_secure')) || [];
        let pin = "";
        let logoClicks = 0;
        let logoTimer;

        // ACCESO
        function handleLogoClick() {
            logoClicks++;
            clearTimeout(logoTimer);
            logoTimer = setTimeout(() => { logoClicks = 0; }, 2000);
            if(logoClicks >= 5) { logoClicks = 0; document.getElementById('pinPanel').classList.add('modal-open'); }
        }

        function pressPin(n) {
            if(pin.length < 4) {
                pin += n;
                const dots = document.getElementById('pinDots').children;
                for(let i=0; i<4; i++) dots[i].className = i < pin.length ? "w-4 h-4 rounded-full bg-red-600" : "w-4 h-4 rounded-full border-2 border-slate-200";
                if(pin === "1593") { closeModals(); document.getElementById('adminPanel').classList.add('modal-open'); pin = ""; resetDots(); }
                else if(pin.length === 4) { showToast("PIN INCORRECTO"); pin = ""; resetDots(); }
            }
        }

        // MANEJO DE IMAGEN (SOLUCIÓN AL ERROR DE IA)
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const base64 = event.target.result;
                document.getElementById('fImg').value = base64;
                document.getElementById('prevImg').src = base64;
                document.getElementById('imgPreview').classList.remove('hidden');
                showToast("IMAGEN LISTA");
            };
            reader.readAsDataURL(file);
        }

        async function runAi(mode) {
            if (!apiKey || apiKey === "") return showToast("FALTA API KEY");
            const input = document.getElementById('rawText').value;
            if(!input) return showToast("PEGA EL TEXTO PRIMERO");

            const btn = document.getElementById('btnAiMan');
            const originalText = btn.innerText;
            btn.innerText = "IA TRABAJANDO..."; btn.disabled = true;

            try {
                const prompt = `Eres periodista. Resume este texto para una nota. Responde solo JSON: {"t":"Titulo","b":"Cuerpo extenso"}: ${input}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                
                const data = await response.json();
                const res = JSON.parse(data.candidates[0].content.parts[0].text);
                document.getElementById('fTitle').value = res.t;
                document.getElementById('fBody').value = res.b;
                showToast("TEXTO RESUMIDO POR IA");
            } catch (e) {
                showToast("ERROR EN IA: USA CARGA MANUAL");
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        }

        // PUBLICAR
        document.getElementById('newsForm').onsubmit = (e) => {
            e.preventDefault();
            const img = document.getElementById('fImg').value;
            if(!img) return showToast("SELECCIONA UNA IMAGEN PRIMERO");

            db.unshift({ 
                id: Date.now(), 
                titulo: document.getElementById('fTitle').value, 
                cuerpo: document.getElementById('fBody').value, 
                img: img, 
                region: document.getElementById('fReg').value, 
                visible: true 
            });
            localStorage.setItem('pulso_v_secure', JSON.stringify(db));
            render(); closeModals(); 
            document.getElementById('newsForm').reset();
            document.getElementById('imgPreview').classList.add('hidden');
            showToast("NOTICIA EN PORTADA");
        };

        // UI GENERAL
        function resetDots() { const dots = document.getElementById('pinDots').children; for(let i=0; i<4; i++) dots[i].className = "w-4 h-4 rounded-full border-2 border-slate-200"; }
        function closeModals() { document.querySelectorAll('.modal-blur').forEach(m => m.classList.remove('modal-open')); }
        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 4000); }
        function openReader(id) { const n = db.find(x => x.id === id); if(!n) return; document.getElementById('readImg').src = n.img; document.getElementById('readRegion').innerText = n.region; document.getElementById('readTitle').innerText = n.titulo; document.getElementById('readBody').innerText = n.cuerpo; document.getElementById('readerPanel').classList.add('modal-open'); }
        
        function render(filter = "TODAS") {
            const grid = document.getElementById('newsGrid'); grid.innerHTML = "";
            const items = filter === "TODAS" ? db.filter(x => x.visible) : db.filter(x => x.region === filter && x.visible);
            items.forEach(n => {
                grid.innerHTML += `
                    <article class="bg-white rounded-[2.5rem] overflow-hidden shadow-xl border border-slate-100 flex flex-col group hover:-translate-y-2 transition-all">
                        <div class="h-64 bg-slate-200"><img src="${n.img}" class="w-full h-full object-cover"></div>
                        <div class="p-8 flex flex-col flex-1">
                            <span class="text-red-600 font-black text-[10px] uppercase tracking-widest">${n.region}</span>
                            <h3 class="serif text-2xl font-black my-4 leading-tight">${n.titulo}</h3>
                            <p class="text-slate-500 text-sm line-clamp-3 mb-6">${n.cuerpo}</p>
                            <button onclick="openReader(${n.id})" class="mt-auto text-red-600 font-black text-[11px] uppercase tracking-widest text-left">Leer Completa →</button>
                        </div>
                    </article>`;
            });
            if(window.lucide) lucide.createIcons();
        }

        function setTab(t) { const isN = t === 'new'; document.getElementById('tabNewContent').classList.toggle('hidden', !isN); document.getElementById('tabListContent').classList.toggle('hidden', isN); document.getElementById('tabN').className = isN ? "text-xs font-black uppercase tracking-widest border-b-4 border-red-500 pb-2" : "text-xs font-black uppercase tracking-widest text-slate-400 pb-2"; document.getElementById('tabL').className = !isN ? "text-xs font-black uppercase tracking-widest border-b-4 border-red-500 pb-2" : "text-xs font-black uppercase tracking-widest text-slate-400 pb-2"; if(!isN) renderList(); }
        function renderList() { const cont = document.getElementById('manageContainer'); cont.innerHTML = ""; db.forEach(n => { cont.innerHTML += `<div class="flex items-center justify-between p-6 bg-slate-50 rounded-[2rem] border border-slate-100 ${!n.visible ? 'opacity-40' : ''}"><div class="flex items-center gap-5"><img src="${n.img}" class="w-12 h-12 rounded-xl object-cover"><p class="text-xs font-black line-clamp-1">${n.titulo}</p></div><div class="flex gap-2"><button onclick="toggleVisibility(${n.id})" class="p-3 bg-white rounded-xl shadow-sm"><i data-lucide="${n.visible ? 'eye' : 'eye-off'}" class="w-4 h-4"></i></button><button onclick="deleteNote(${n.id})" class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`; }); if(window.lucide) lucide.createIcons(); }
        window.deleteNote = (id) => { if(confirm("¿Eliminar?")) { db = db.filter(n => n.id !== id); localStorage.setItem('pulso_v_secure', JSON.stringify(db)); render(); renderList(); } };
        window.toggleVisibility = (id) => { const n = db.find(x => x.id === id); if(n){ n.visible = !n.visible; localStorage.setItem('pulso_v_secure', JSON.stringify(db)); render(); renderList(); } };
        window.onload = () => { render(); if(window.lucide) lucide.createIcons(); };
    </script>
</body>
</html>
