<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL PULSO | Regional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Crimson+Pro:wght@600;800&display=swap');
        
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; margin: 0; }
        .serif { font-family: 'Crimson Pro', serif; }
        
        .modal-blur {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-open { display: flex !important; }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Prevenir selección de texto en el logo para que los clics sean limpios */
        #logoTrigger {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="text-slate-900">

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl text-[10px] font-black z-[5000] hidden shadow-2xl uppercase tracking-widest text-center"></div>

    <!-- NAVEGACIÓN -->
    <nav class="bg-white border-b sticky top-0 z-50 h-20 shadow-sm">
        <div class="container mx-auto px-4 h-full flex items-center justify-between">
            <!-- Logo con SVG integrado -->
            <div id="logoTrigger" class="flex items-center gap-3 cursor-pointer group">
                <div class="bg-red-600 text-white p-2.5 rounded-2xl group-active:scale-95 transition-transform shadow-lg shadow-red-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tighter uppercase leading-none">EL PULSO</h1>
                    <p class="text-[9px] font-bold text-red-600 uppercase tracking-[0.2em] leading-none mt-1">Regional</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <select onchange="render(this.value)" class="text-[11px] font-black uppercase bg-slate-100 px-6 py-3 rounded-2xl border-none outline-none appearance-none cursor-pointer hover:bg-slate-200 transition-colors">
                    <option value="TODAS">TODAS LAS REGIONES</option>
                    <option value="TLAXCALA">TLAXCALA</option>
                    <option value="PUEBLA">PUEBLA</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- PORTADA -->
    <main class="container mx-auto px-4 py-10 max-w-7xl">
        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <!-- LECTOR DE NOTICIA COMPLETA -->
    <div id="readerPanel" class="modal-blur">
        <div class="bg-white w-full max-w-3xl rounded-[2.5rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="relative h-80 bg-slate-200">
                <img id="readImg" src="" class="w-full h-full object-cover">
                <button onclick="closeModals()" class="absolute top-6 right-6 bg-black/40 text-white p-4 rounded-full backdrop-blur-md hover:bg-black/60 transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="p-10 overflow-y-auto">
                <span id="readRegion" class="text-red-600 font-black text-xs uppercase tracking-widest"></span>
                <h2 id="readTitle" class="serif text-4xl font-black my-6 leading-tight text-slate-900"></h2>
                <div id="readBody" class="text-slate-600 text-xl leading-relaxed space-y-6 whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <!-- ACCESO PIN (1593) -->
    <div id="pinPanel" class="modal-blur">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center border border-slate-100">
            <h3 class="font-black text-xs uppercase tracking-widest mb-8 text-slate-400">Acceso Restringido</h3>
            <div id="pinDots" class="flex justify-center gap-5 mb-10">
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-slate-200"></div>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <script>
                    for(let i=1; i<=9; i++) document.write(`<button onclick="pressPin('${i}')" class="h-16 bg-slate-50 hover:bg-slate-100 rounded-2xl font-bold text-xl transition-colors">${i}</button>`);
                </script>
                <button onclick="pin=''" class="h-16 bg-red-50 text-red-500 rounded-2xl font-bold">C</button>
                <button onclick="pressPin('0')" class="h-16 bg-slate-50 hover:bg-slate-100 rounded-2xl font-bold text-xl">0</button>
                <button onclick="closeModals()" class="h-16 bg-slate-100 text-slate-400 rounded-2xl font-bold">ESC</button>
            </div>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="adminPanel" class="modal-blur">
        <div class="bg-white w-full max-w-4xl rounded-[3rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="p-8 bg-slate-900 text-white flex justify-between items-center">
                <div class="flex gap-8">
                    <button onclick="setTab('new')" id="tabN" class="text-xs font-black uppercase tracking-widest border-b-4 border-red-500 pb-2">Nueva Publicación</button>
                    <button onclick="setTab('list')" id="tabL" class="text-xs font-black uppercase tracking-widest text-slate-400 pb-2">Gestionar Notas</button>
                </div>
                <button onclick="closeModals()" class="text-slate-400 hover:text-white p-2 transition-colors"><i data-lucide="x" class="w-7 h-7"></i></button>
            </div>

            <div id="tabNewContent" class="p-10 overflow-y-auto space-y-8">
                <div class="flex bg-slate-100 p-1.5 rounded-[1.5rem] gap-2">
                    <button onclick="setMode('url')" id="mUrl" class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-white shadow-sm transition-all">Enlace Automático</button>
                    <button onclick="setMode('manual')" id="mMan" class="flex-1 py-4 rounded-2xl text-xs font-black uppercase text-slate-400 transition-all">Redacción Manual</button>
                </div>

                <div id="secUrl" class="space-y-4">
                    <input type="url" id="urlInput" placeholder="Pega el enlace de la noticia aquí..." class="w-full bg-slate-50 border-2 border-transparent focus:border-red-500 p-5 rounded-[1.5rem] outline-none transition-all">
                    <button onclick="runAi('url')" id="btnAiUrl" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-xs uppercase tracking-widest hover:bg-slate-800 transition-all">Extraer con IA</button>
                </div>

                <div id="secMan" class="hidden space-y-4">
                    <textarea id="rawText" rows="6" placeholder="Pega el texto de la noticia para resumir..." class="w-full bg-slate-50 border-2 border-transparent focus:border-red-500 p-5 rounded-[1.5rem] outline-none transition-all"></textarea>
                    <button onclick="runAi('manual')" id="btnAiMan" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-xs uppercase tracking-widest hover:bg-slate-800 transition-all">Procesar Texto</button>
                </div>

                <form id="newsForm" class="space-y-5 pt-6 border-t border-slate-100">
                    <div class="grid grid-cols-2 gap-4">
                        <select id="fReg" class="bg-slate-50 p-5 rounded-2xl font-bold text-sm outline-none">
                            <option value="TLAXCALA">TLAXCALA</option>
                            <option value="PUEBLA">PUEBLA</option>
                        </select>
                        <input type="text" id="fImg" placeholder="URL de la imagen destacada" class="bg-slate-50 p-5 rounded-2xl text-sm outline-none" required>
                    </div>
                    <input type="text" id="fTitle" placeholder="Título de la noticia" class="w-full bg-slate-50 p-5 rounded-2xl font-bold text-lg outline-none" required>
                    <textarea id="fBody" rows="6" placeholder="Cuerpo o resumen de la noticia..." class="w-full bg-slate-50 p-5 rounded-2xl text-base outline-none" required></textarea>
                    <button type="submit" class="w-full bg-red-600 text-white font-black py-6 rounded-[1.5rem] shadow-xl shadow-red-100 text-sm uppercase tracking-[0.2em] hover:bg-red-700 transition-all">Publicar en el Portal</button>
                </form>
            </div>

            <div id="tabListContent" class="p-10 hidden overflow-y-auto">
                <div id="manageContainer" class="grid gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const apiKey = "AIzaSyB1KthG1cWhrzBbckh01Fjx7XB8AoVCtNw"; 

        let db = JSON.parse(localStorage.getItem('pulso_v_secure')) || [];
        let pin = "";
        let logoClicks = 0;
        let logoTimer;

        // Listener para el logo (5 clics rápidos)
        const logoTrigger = document.getElementById('logoTrigger');
        logoTrigger.addEventListener('mousedown', (e) => {
            // Prevenir selección accidental mientras se cliquea rápido
            e.preventDefault();
            
            logoClicks++;
            clearTimeout(logoTimer);
            
            // Si pasan más de 1.5 segundos sin clics, se reinicia la cuenta
            logoTimer = setTimeout(() => { 
                logoClicks = 0; 
            }, 1500);

            if(logoClicks >= 5) {
                logoClicks = 0;
                document.getElementById('pinPanel').classList.add('modal-open');
            }
        });

        function pressPin(n) {
            if(pin.length < 4) {
                pin += n;
                const dots = document.getElementById('pinDots').children;
                for(let i=0; i<4; i++) dots[i].className = i < pin.length ? "w-4 h-4 rounded-full bg-red-600 shadow-sm" : "w-4 h-4 rounded-full border-2 border-slate-200";
                
                if(pin === "1593") {
                    closeModals();
                    document.getElementById('adminPanel').classList.add('modal-open');
                    pin = ""; resetDots();
                } else if(pin.length === 4) {
                    showToast("PIN INCORRECTO"); pin = ""; resetDots();
                }
            }
        }

        function resetDots() {
            const dots = document.getElementById('pinDots').children;
            for(let i=0; i<4; i++) dots[i].className = "w-4 h-4 rounded-full border-2 border-slate-200";
        }

        function closeModals() { 
            document.querySelectorAll('.modal-blur').forEach(m => m.classList.remove('modal-open')); 
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function setMode(m) {
            const isUrl = m === 'url';
            document.getElementById('secUrl').classList.toggle('hidden', !isUrl);
            document.getElementById('secMan').classList.toggle('hidden', isUrl);
            document.getElementById('mUrl').className = isUrl ? "flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-white shadow-sm transition-all" : "flex-1 py-4 rounded-2xl text-xs font-black uppercase text-slate-400 transition-all";
            document.getElementById('mMan').className = !isUrl ? "flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-white shadow-sm transition-all" : "flex-1 py-4 rounded-2xl text-xs font-black uppercase text-slate-400 transition-all";
        }

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, backoff));
                    backoff *= 2;
                }
            }
        }

        async function runAi(mode) {
            if (!apiKey) return showToast("FALTA API KEY EN EL CÓDIGO");
            const input = mode === 'url' ? document.getElementById('urlInput').value : document.getElementById('rawText').value;
            if(!input) return showToast("ESCRIBE O PEGA ALGO");
            const btn = mode === 'url' ? document.getElementById('btnAiUrl') : document.getElementById('btnAiMan');
            const originalText = btn.innerText;
            btn.innerText = "PROCESANDO..."; btn.disabled = true;
            showToast("IA ANALIZANDO CONTENIDO...");
            try {
                const prompt = `Eres un periodista experto. ${mode === 'url' ? 'Extrae la información clave del siguiente enlace' : 'Resume el siguiente texto'}: ${input}. Responde estrictamente en formato JSON: {"t":"Titulo Impactante y Corto","b":"Cuerpo de la noticia bien redactado y profesional","q":"descripción visual para generar una foto de prensa"}`;
                const textData = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: "Responde siempre en español y solo devuelve el JSON puro." }] },
                        tools: mode === 'url' ? [{ "google_search": {} }] : [],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const res = JSON.parse(textData.candidates[0].content.parts[0].text);
                document.getElementById('fTitle').value = res.t;
                document.getElementById('fBody').value = res.b;
                showToast("GENERANDO IMAGEN...");
                const imgData = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instances: { prompt: `Professional journalism photography, realistic, 4k, ${res.q}` }, parameters: { sampleCount: 1 } })
                });
                if (imgData.predictions?.[0]?.bytesBase64Encoded) {
                    document.getElementById('fImg').value = `data:image/png;base64,${imgData.predictions[0].bytesBase64Encoded}`;
                }
                showToast("NOTICIA LISTA PARA PUBLICAR");
            } catch (e) {
                console.error(e); showToast("ERROR DE CONEXIÓN O LLAVE");
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        }

        document.getElementById('newsForm').onsubmit = (e) => {
            e.preventDefault();
            db.unshift({
                id: Date.now(),
                titulo: document.getElementById('fTitle').value,
                cuerpo: document.getElementById('fBody').value,
                img: document.getElementById('fImg').value,
                region: document.getElementById('fReg').value,
                visible: true
            });
            localStorage.setItem('pulso_v_secure', JSON.stringify(db));
            render(); closeModals(); document.getElementById('newsForm').reset();
            document.getElementById('urlInput').value = ""; document.getElementById('rawText').value = "";
            showToast("PUBLICADO CON ÉXITO");
        };

        function openReader(id) {
            const n = db.find(x => x.id === id);
            if(!n) return;
            document.getElementById('readImg').src = n.img;
            document.getElementById('readRegion').innerText = n.region;
            document.getElementById('readTitle').innerText = n.titulo;
            document.getElementById('readBody').innerText = n.cuerpo;
            document.getElementById('readerPanel').classList.add('modal-open');
        }

        function render(filter = "TODAS") {
            const grid = document.getElementById('newsGrid'); grid.innerHTML = "";
            const items = filter === "TODAS" ? db.filter(x => x.visible) : db.filter(x => x.region === filter && x.visible);
            items.forEach(n => {
                grid.innerHTML += `
                    <article class="bg-white rounded-[2.5rem] overflow-hidden shadow-xl shadow-slate-200/50 border border-slate-100 flex flex-col group hover:-translate-y-2 transition-all duration-300">
                        <div class="h-64 relative overflow-hidden bg-slate-200">
                            <img src="${n.img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                        </div>
                        <div class="p-8 flex flex-col flex-1">
                            <span class="text-red-600 font-black text-[10px] uppercase tracking-[0.3em]">${n.region}</span>
                            <h3 class="serif text-2xl font-black my-4 leading-tight group-hover:text-red-600 transition-colors">${n.titulo}</h3>
                            <p class="text-slate-500 text-sm leading-relaxed line-clamp-3 mb-6">${n.cuerpo}</p>
                            <button onclick="openReader(${n.id})" class="mt-auto flex items-center gap-2 text-red-600 font-black text-[11px] uppercase tracking-widest hover:gap-4 transition-all">
                                Leer noticia completa <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </article>`;
            });
            if(typeof lucide !== 'undefined') lucide.createIcons();
        }

        function setTab(t) {
            const isN = t === 'new';
            document.getElementById('tabNewContent').classList.toggle('hidden', !isN);
            document.getElementById('tabListContent').classList.toggle('hidden', isN);
            document.getElementById('tabN').className = isN ? "text-xs font-black uppercase tracking-widest border-b-4 border-red-500 pb-2" : "text-xs font-black uppercase tracking-widest text-slate-400 pb-2";
            document.getElementById('tabL').className = !isN ? "text-xs font-black uppercase tracking-widest border-b-4 border-red-500 pb-2" : "text-xs font-black uppercase tracking-widest text-slate-400 pb-2";
            if(!isN) renderList();
        }
